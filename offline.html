<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offline - Indra Konveksi</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    background: #0d4f8a;
    color: #fff;
    text-align: center;
    padding: 24px;
  }
  .box { max-width: 420px; }
  .icon { font-size: 64px; margin-bottom: 8px; }
  h1 { font-size: 22px; margin: 8px 0; }
  p { opacity: .85; margin: 0 0 20px; line-height: 1.5; }
  button {
    background: #f9a825;
    color: #1a1a1a;
    border: none;
    padding: 12px 28px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
  }
  button:active { transform: scale(.98); }
</style>
</head>
<body>
  <div class="box">
    <div class="icon">📶</div>
    <h1>Tidak Ada Koneksi Internet</h1>
    <p>Sepertinya kamu sedang offline. Periksa koneksi internet lalu coba lagi. Halaman yang pernah dibuka sebelumnya mungkin masih bisa diakses.</p>
    <button onclick="window.location.reload()">Coba Lagi</button>
  </div>
</body>
</html>
